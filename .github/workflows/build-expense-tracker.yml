name: Build Expense Tracker APK

on:
  push:
    paths:
      - "ExpenseTracker/**"
      - ".github/workflows/build-expense-tracker.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ExpenseTracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Repository secret GOOGLE_SERVICES_JSON = full contents of google-services.json
      # (Settings → Secrets and variables → Actions → New repository secret).
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"123456789012","project_id":"placeholder-check","storage_bucket":"placeholder-check.appspot.com"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:0123456789abcdef","android_client_info":{"package_name":"com.shajith.expensetracker"}},
           "oauth_client":[],"api_key":[{"current_key":"AIzaPlaceholderPlaceholderPlaceholder00"}],
           "services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON
          exit 0
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || {
            { grep -E "^e: " build.log; grep -A6 "What went wrong" build.log; } | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-apk
          path: ExpenseTracker/app/build/outputs/apk/debug/app-debug.apk
